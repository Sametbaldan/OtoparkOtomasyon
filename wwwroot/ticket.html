<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dijital Park Fişi</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"><div class="container py-4" style="max-width:420px">
<div class="card shadow-sm"><div class="card-body text-center" id="box">Yükleniyor…</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(async () => {
  const code = new URLSearchParams(location.search).get('code');
  const box = document.getElementById('box');
  try {
    const res = await fetch('/api/parking/ticket/' + encodeURIComponent(code));
    const t = await res.json();
    if (!res.ok) throw new Error(t.message);
    const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = v => Number(v).toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' });
    box.innerHTML = `<h5>🅿️ Park Fişi</h5><div class="fs-2 fw-bold">${esc(t.plate)}</div>
      <div>${esc(t.vehicleType)} • Yer: ${esc(t.slot ?? '-')}</div>
      <div class="text-muted small">Giriş: ${new Date(t.entryTime).toLocaleString('tr-TR')}</div>
      <div class="my-2"><span class="badge bg-${t.status === 'Otoparkta' ? 'primary' : 'secondary'}">${esc(t.status)}</span></div>
      <div>Süre: ${Math.floor(t.minutes / 60)} sa ${t.minutes % 60} dk</div>
      <div class="display-6 my-2">${t.isSubscriber ? 'Abone' : money(t.fee)}</div>
      <div id="qr" class="d-flex justify-content-center my-2"></div>
      <div class="font-monospace">${esc(t.ticketCode)}</div>
      <div class="small text-muted mt-2">Çıkışta bu kodu vezneye gösterin.</div>`;
    new QRCode(document.getElementById('qr'), { text: location.href, width: 140, height: 140 });
  } catch (e) { box.textContent = e.message || 'Fiş bulunamadı.'; }
})();
</script></body></html>
